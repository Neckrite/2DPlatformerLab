# Кастомная конфигурация Nginx для раздачи Unity 6 WebGL (Gzip)
# Файлы сборки Unity 6 уже сжаты в Gzip (.gz). Сервер обязан сообщить
# браузеру заголовок Content-Encoding: gzip и правильный MIME-тип,
# иначе браузер блокирует запуск игры с ошибкой "Unable to parse...".
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Статика: загрузчик, стили, шаблон страницы
    location / {
        try_files $uri $uri/ =404;
    }

    # --- Сжатые Unity 6 файлы: Content-Type + Content-Encoding: gzip ---

    # WebGL.data.gz -> application/octet-stream
    location ~* \.data\.gz$ {
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WebGL.wasm.gz -> application/wasm
    location ~* \.wasm\.gz$ {
        types { }
        default_type application/wasm;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WebGL.framework.js.gz и WebGL.loader.js.gz -> application/javascript
    location ~* \.framework\.js\.gz$ {
        types { }
        default_type application/javascript;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.loader\.js\.gz$ {
        types { }
        default_type application/javascript;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Символы отладки (если присутствуют)
    location ~* \.symbols\.gz$ {
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
    }
}
