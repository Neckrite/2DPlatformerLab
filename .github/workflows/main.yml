# Основной пайплайн автоматизации проекта: проверка структуры (Sanity Check),
# тесты (ЛР №4), облачная компиляция игры и деплой на GitHub Pages (ЛР №5),
# Docker-образ с настоящей игрой в GHCR и зеркалирование (Disaster Recovery).
name: Unity 2D Platformer CI/CD

# Триггер запуска: реакция на любой push в основную ветку main
on:
  push:
    branches: [ "main" ]

jobs:
  # Задача 1: быстрая диагностика структуры проекта (Sanity Check)
  sanity_check:
    runs-on: ubuntu-latest # работа на бесплатном облачном сервере Linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # скачиваем весь код из репозитория в облако

      - name: Check Unity Directories
        run: |
          echo "=== Проверка ключевых папок Unity ==="
          if [ -d "ProjectSettings" ]; then echo "ProjectSettings найдена."; else echo "Ошибка!" && exit 1; fi
          if [ -d "Packages" ]; then echo "Packages найдена."; else echo "Ошибка!" && exit 1; fi

      - name: Locate 2D Platformer Scripts
        run: |
          echo "=== Поиск C# скриптов в папке Assets ==="
          find Assets/ -name "*Controller.cs" -print
          find Assets/ -name "BuildManager.cs" -print

  # Задача 2 (ЛР №4): автоматический запуск Unity-тестов в контейнере unityci/editor.
  # Гейт качества: сборка образа и зеркалирование стартуют только после зелёных тестов.
  run_tests:
    needs: sanity_check # тесты запускаются сразу после проверки структуры проекта
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # поддержка Git LFS на случай тяжелой графики

      # Кэш папки Library: импорт ассетов выполняется один раз, повторные прогоны быстрее
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      # Официальный CLI GameCI с фиксированной версией
      - name: Install GameCI CLI
        run: |
          curl -sL -o game-ci.tar.gz https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz
          tar xzf game-ci.tar.gz ./game-ci
          echo "$PWD" >> $GITHUB_PATH

      # Тесты EditMode и PlayMode в контейнере unityci/editor.
      # CLI вызывается напрямую: экшен game-ci/unity-test-runner@v4 формирует флаг
      # --no-coverageEnabled, которого CLI v0.1.72 не понимает. Coverage отключен:
      # инструментирование кода роняет Unity 6 в контейнере (SIGSEGV, exit code 139).
      - name: Run Unity Tests
        run: |
          game-ci test --docker --dockerShmSize=1025m \
            --engine=unity --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
            --engineVersion=6000.4.8f1 --coverageEnabled=false \
            --artifactsPath=artifacts --dockerIsolationMode=default \
            --containerRegistryRepository=unityci/editor \
            --containerRegistryImageVersion=3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }} # содержимое .ulf из Unity Hub
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}     # email аккаунта Unity
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }} # пароль аккаунта Unity

      # Результаты и логи тестов сохраняем артефактом даже при падении
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/

  # Задача 3 (ЛР №5): настоящая компиляция игры в облаке.
  # game-ci/unity-builder поднимает контейнер Unity 6, активирует лицензию и
  # вызывает C# метод BuildManager.BuildWebGL из ЛР №1.
  build_game:
    needs: run_tests # запустится только если тесты из ЛР №4 прошли успешно
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # в игре могут быть тяжелые бинарные ассеты

      # Кэшируем Library, чтобы компиляция не шла вечность (25-30 мин -> 2-3 мин)
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Build-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      # Вызываем облачный компилятор Unity 6 от GameCI
      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          # Вызов C# метода автоматизации из Лабораторной работы №1
          buildMethod: BuildManager.BuildWebGL
          # Версия Unity указывается явно: ProjectVersion.txt в .gitignore
          unityVersion: 6000.4.8f1

      # Сохраняем НАСТОЯЩИЕ скомпилированные файлы во временное облачное хранилище
      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

  # Задача 4: автоматическое зеркалирование в резервный репозиторий
  mirror_repo:
    needs: run_tests # зеркалирование начнется только после успешных тестов
    if: github.repository == 'Neckrite/2DPlatformerLab' # только в основном репозитории, чтобы избежать цикла в backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # скачиваем полную историю коммитов для корректного зеркалирования
          persist-credentials: false # отключаем credential helper, чтобы GITHUB_TOKEN не конфликтовал с PAT

      - name: Verify token is set
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "=== Ошибка: BACKUP_TOKEN is empty! Create a PAT with scopes [repo, workflow] ==="
            exit 1
          else
            echo "=== BACKUP_TOKEN is set (length: ${#BACKUP_TOKEN}) ==="
          fi

      - name: Push to Backup Repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          echo "=== Начало зеркалирования репозитория ==="
          git push --force https://x-access-token:${BACKUP_TOKEN}@github.com/Neckrite/2DPlatformerLab_backup.git main
          echo "=== Код успешно продублирован ==="

  # Задача 5 (ЛР №5): сборка Docker-образа с НАСТОЯЩЕЙ игрой вместо заглушек
  build_docker_image:
    needs: build_game # теперь ждем полноценного билда игры
    if: github.repository == 'Neckrite/2DPlatformerLab'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # право публиковать пакет в GitHub Container Registry
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Вместо генерации фейковых заглушек (touch) скачиваем живой билд из build_game
      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # системный автоматический токен GitHub

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/neckrite/platformer-webgl:latest
            ghcr.io/neckrite/platformer-webgl:${{ github.sha }}

  # Задача 6 (ЛР №5): автоматический деплой игры на GitHub Pages
  deploy_to_pages:
    needs: build_game # деплоим только успешно собранную игру
    if: github.repository == 'Neckrite/2DPlatformerLab'
    runs-on: ubuntu-latest
    # Публикация в ветку gh-pages требует прав на запись содержимого репозитория
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      # Публикуем папку Builds/WebGL в специальную служебную ветку gh-pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Builds/WebGL
          branch: gh-pages # ветка для хостинга страниц
