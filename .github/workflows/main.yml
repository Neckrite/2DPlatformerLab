# Основной пайплайн автоматизации проекта: проверка структуры (Sanity Check)
# и зеркалирование репозитория в резервный контур (Disaster Recovery).
name: Unity 2D Platformer CI/CD

# Триггер запуска: реакция на любой push в основную ветку main
on:
  push:
    branches: [ "main" ]

jobs:
  # Задача 1: быстрая диагностика структуры проекта (Sanity Check)
  sanity_check:
    runs-on: ubuntu-latest # работа на бесплатном облачном сервере Linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # скачиваем весь код из репозитория в облако

      - name: Check Unity Directories
        run: |
          echo "=== Проверка ключевых папок Unity ==="
          if [ -d "ProjectSettings" ]; then echo "ProjectSettings найдена."; else echo "Ошибка!" && exit 1; fi
          if [ -d "Packages" ]; then echo "Packages найдена."; else echo "Ошибка!" && exit 1; fi

      - name: Locate 2D Platformer Scripts
        run: |
          echo "=== Поиск C# скриптов в папке Assets ==="
          find Assets/ -name "*Controller.cs" -print
          find Assets/ -name "BuildManager.cs" -print

  # Задача 2: автоматическое зеркалирование в резервный репозиторий
  mirror_repo:
    needs: sanity_check # гарантирует, что зеркалирование начнётся только после успешной проверки структуры
    if: github.repository == 'Neckrite/2DPlatformerLab' # выполняется только в основном репозитории, чтобы избежать цикла в backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # скачиваем всю историю коммитов для корректного зеркалирования
          persist-credentials: false # отключаем credential helper, чтобы GITHUB_TOKEN не конфликтовал с PAT

      - name: Verify token is set
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "=== Ошибка: BACKUP_TOKEN is empty! Create a PAT with scopes [repo, workflow] ==="
            exit 1
          else
            echo "=== BACKUP_TOKEN is set (length: ${#BACKUP_TOKEN}) ==="
          fi

      - name: Push to Backup Repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          echo "=== Начало зеркалирования репозитория ==="
          git push --force https://x-access-token:${BACKUP_TOKEN}@github.com/Neckrite/2DPlatformerLab_backup.git main
          echo "=== Код успешно продублирован ==="

  # Задача 3: сборка и публикация Docker-образа веб-сервера (Nginx + Unity WebGL Gzip) в GHCR
  docker_ghcr:
    needs: sanity_check # образ собирается только для проверенного кода
    if: github.repository == 'Neckrite/2DPlatformerLab'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # право публиковать пакет в GitHub Container Registry
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create placeholder WebGL build (Builds/ отсечён .gitignore)
        run: |
          mkdir -p Builds/WebGL/Build
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Platformer WebGL</title></head><body>Placeholder build (real build is produced locally by Unity)</body></html>' > Builds/WebGL/index.html
          touch Builds/WebGL/Build/WebGL.loader.js.gz
          touch Builds/WebGL/Build/WebGL.framework.js.gz
          touch Builds/WebGL/Build/WebGL.wasm.gz
          touch Builds/WebGL/Build/WebGL.data.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/neckrite/platformer-webgl:latest
            ghcr.io/neckrite/platformer-webgl:${{ github.sha }}
